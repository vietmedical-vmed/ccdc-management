<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 0; background: #f0f2f5; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f0f2f5; z-index: 100; }
  #boot .spinner { width: 32px; height: 32px; border: 3px solid #dadde1; border-top-color: #1877f2; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  #boot .err { color: #fa383e; font-size: 12px; max-width: 400px; margin-top: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input, button, select, textarea { font-family: inherit; }
  body { color: #18191a; }
  .spinner { width: 32px; height: 32px; border: 3px solid #dadde1; border-top-color: #1877f2; border-radius: 50%; animation: spin .8s linear infinite; }
  .scroll-shadow::-webkit-scrollbar { height: 8px; width: 8px; }
  .scroll-shadow::-webkit-scrollbar-thumb { background: #ccd0d5; border-radius: 4px; }
  .scroll-shadow::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="boot">
  <div style="text-align:center;color:#65676b;font-size:13px">
    <div class="spinner"></div>
    Đang khởi động…
    <div id="boot-err" class="err"></div>
  </div>
</div>
<div id="root"></div>

<script>
  setTimeout(function () {
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      document.getElementById('boot-err').textContent = 'Không tải được React/ReactDOM từ CDN.';
    }
  }, 5000);
</script>
